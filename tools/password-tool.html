<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ابزار ساخت رمز سهمینه</title>
<style>body{font-family:Tahoma,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem;line-height:1.9}input{width:100%;padding:.5rem;font-size:1.1rem;direction:ltr}code{display:block;background:#eef;padding:.7rem;direction:ltr;text-align:left;word-break:break-all;margin:.5rem 0}</style></head><body>
<h2>ابزار ساخت رمز فعال‌سازی سهمینه</h2>
<p>رمز دلخواه را بنویسید. هش آن را در <b>passHashes</b> فایل <b>index.html</b> بگذارید (می‌توانید چند رمز داشته باشید). رمز خود را در index.html ننویسید، فقط هش.</p>
<input id="p" placeholder="رمز" autocomplete="off"><p>هش:</p><code id="o">-</code><p>خط آمادهٔ index.html:</p><code id="l">-</code>
<script>
const SALT="sahmine|";
const sha256=(()=>{
 const K=[],H0=[];
 for(let p=2;K.length<64;p++){let ok=true;for(let d=2;d*d<=p;d++)if(p%d===0){ok=false;break}
  if(ok){if(H0.length<8)H0.push((Math.pow(p,.5)%1)*4294967296|0);K.push((Math.pow(p,1/3)%1)*4294967296|0)}}
 return str=>{
  const b=Array.from(new TextEncoder().encode(str)),l=b.length*8;
  b.push(0x80);while(b.length%64!==56)b.push(0);
  const hi=Math.floor(l/4294967296),lo=l>>>0;
  for(let i=3;i>=0;i--)b.push((hi>>>(i*8))&255);
  for(let i=3;i>=0;i--)b.push((lo>>>(i*8))&255);
  const hs=H0.slice(),w=new Array(64);
  for(let o=0;o<b.length;o+=64){
   for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
   for(let i=16;i<64;i++){const x=w[i-15],y=w[i-2];
    const s0=((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3);
    const s1=((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10);
    w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
   let a=hs[0],bb=hs[1],c=hs[2],d=hs[3],e=hs[4],f=hs[5],g=hs[6],hh=hs[7];
   for(let i=0;i<64;i++){
    const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
    const ch=(e&f)^(~e&g);
    const t1=(hh+S1+ch+K[i]+w[i])|0;
    const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
    const mj=(a&bb)^(a&c)^(bb&c);
    const t2=(S0+mj)|0;
    hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0}
   hs[0]=(hs[0]+a)|0;hs[1]=(hs[1]+bb)|0;hs[2]=(hs[2]+c)|0;hs[3]=(hs[3]+d)|0;hs[4]=(hs[4]+e)|0;hs[5]=(hs[5]+f)|0;hs[6]=(hs[6]+g)|0;hs[7]=(hs[7]+hh)|0}
  return hs.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")}
})();
const p=document.getElementById("p");
p.oninput=()=>{const v=p.value.trim().replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));if(!v){o.textContent=l.textContent="-";return}const x=sha256(SALT+v);o.textContent=x;l.textContent='passHashes:["'+x+'"],'}
</script></body></html>
